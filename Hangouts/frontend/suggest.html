<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suggest a Place 📍</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #fff8f5; color: #333; }
    .container { max-width: 600px; margin: 0 auto; padding: 24px 20px; }
    h1 { color: #ff6b35; margin-bottom: 6px; }
    .subtitle { color: #888; margin-bottom: 24px; font-size: 14px; }
    .section { margin-bottom: 20px; }
    label { font-weight: bold; display: block; margin-bottom: 8px; }
    input, textarea { width: 100%; padding: 10px 14px; border: 2px solid #eee; border-radius: 10px; font-size: 15px; outline: none; }
    input:focus, textarea:focus { border-color: #ff6b35; }
    textarea { resize: vertical; min-height: 80px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { padding: 8px 16px; border-radius: 20px; border: 2px solid #ff6b35; background: white; color: #ff6b35; cursor: pointer; font-weight: bold; font-size: 14px; }
    .chip.active { background: #ff6b35; color: white; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .submit-btn { width: 100%; padding: 14px; background: #ff6b35; color: white; border: none; border-radius: 25px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .success { display: none; text-align: center; padding: 40px 20px; }
    .back-link { display: block; text-align: center; margin-top: 16px; color: #ff6b35; text-decoration: none; font-weight: bold; }
    .note { font-size: 12px; color: #aaa; margin-top: 6px; }
  </style>
</head>
